name: retinaseg_ai
description: "RetinaSeg AI – Automated Retinal Layer Segmentation in OCT Images"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  dio: ^5.4.3+1
  http: ^1.2.1
  intl: ^0.19.0
  file_picker: ^8.0.5
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  google_fonts: ^6.2.1
  pdf: ^3.10.8
  printing: ^5.13.1
  uuid: ^4.4.0
  fl_chart: ^0.68.0

  # Firebase Core & Cloud Services
  firebase_core: ^2.30.1
  firebase_auth: ^4.19.4
  cloud_firestore: ^4.17.2
  firebase_storage: ^11.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/sample_scans/
