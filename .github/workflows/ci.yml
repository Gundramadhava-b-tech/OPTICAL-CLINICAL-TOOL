name: Master CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-api:
    name: "🧪 Unit Tests — API (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Run Unit Tests
        run: |
          mkdir -p reports/unit-test-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/unit/test_api_and_services.py tests/unit/test_oct_ai_pipeline.py \
            --html=reports/unit-test-report/unit_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/unit-test-report/unit_report.json || true
      - name: Upload Unit Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: reports/unit-test-report/

  validation-tests:
    name: "✅ Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Run Validation Test Suite
        run: |
          mkdir -p reports/validation-test-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/validation/test_clinical_validation.py \
            --html=reports/validation-test-report/validation_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/validation-test-report/validation_report.json || true
      - name: Upload Validation Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: reports/validation-test-report/

  selenium-website-tests:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Run Selenium Website E2E Tests
        run: |
          mkdir -p reports/selenium-web-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/selenium/test_web_selenium.py \
            --html=reports/selenium-web-report/selenium_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/selenium-web-report/selenium_report.json || true
      - name: Upload Selenium Web Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: reports/selenium-web-report/

  appium-android-tests:
    name: "📱 Appium — Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Run Appium Android E2E Tests
        run: |
          mkdir -p reports/appium-android-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/appium/test_android_appium.py \
            --html=reports/appium-android-report/appium_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/appium-android-report/appium_report.json || true
      - name: Upload Appium Android Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: reports/appium-android-report/

  load-testing-performance:
    name: "⚡ Load Testing — Performance (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Run k6 Performance Load Tests
        run: |
          mkdir -p reports/load-test-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/performance/test_load_performance.py \
            --html=reports/load-test-report/load_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/load-test-report/load_report.json || true
      - name: Upload Load Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: reports/load-test-report/

  deployment-status:
    name: "🚀 Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: |
          pip install fastapi uvicorn sqlalchemy pydantic passlib[bcrypt] python-jose[cryptography] python-multipart requests pytest pytest-html pytest-json-report onnxruntime opencv-python numpy firebase-admin httpx
      - name: Verify Live Deployment Status
        run: |
          mkdir -p reports/deployment-test-report
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          pytest tests/deployment/test_deployment_integrity.py \
            --html=reports/deployment-test-report/deployment_test_report.html --self-contained-html \
            --json-report --json-report-file=reports/deployment-test-report/deployment_report.json || true
      - name: Upload Deployment Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: reports/deployment-test-report/

  compile-master-report:
    name: "📊 Compile Master Report & Deploy"
    needs: [unit-tests-api, validation-tests, selenium-website-tests, appium-android-tests, load-testing-performance, deployment-status]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download All Reports
        uses: actions/download-artifact@v4
        with:
          path: downloaded-reports
      - name: Generate Master Dashboard & Excel Reports
        run: |
          mkdir -p build/reports
          python -m pip install --upgrade pip
          pip install openpyxl
          python scripts/generate_master_report.py --input-dir downloaded-reports --output-dir build/reports --commit-sha ${{ github.sha }} --run-number ${{ github.run_number }}
      - name: Upload Master Excel Report
        uses: actions/upload-artifact@v4
        with:
          name: master-excel-report
          path: build/reports/master_report.xlsx
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages Deployment Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/reports
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
